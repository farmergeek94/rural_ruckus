[package]
name = "ruckus_rumble"
version = "0.1.0"
edition = "2024"
description = "The rules of a Summit Rumble and the mind of a computer truck in one, as plain data and pure functions over the content model"

[dependencies]
# The content model the rumble is played on: the ground, the ground boxes and the zones.
content = { package = "ruckus_content", path = "../content" }
# For its vectors alone, as `content` uses them. No default features: no engine.
bevy = { version = "0.19", default-features = false }
