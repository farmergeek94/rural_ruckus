[package]
name = "monster_truck_rural_ruckus"
version = "0.1.0"
edition = "2024"

[dependencies]
# avian3d releases are tied to one Bevy minor version: upgrade them together.
bevy = "0.19"
# The physics engine (see `docs/avian.md`, and `physics.rs` for how it is set up). Only
# what the game uses: no colliders from meshes, scenes or picking. `parallel` spreads a
# step's work over the CPU's cores, with eight trucks and their wheels to solve 120 times
# a second.
avian3d = { version = "0.7", default-features = false, features = [
    "3d",
    "f32",
    "parry-f32",
    "parallel",
    "debug-plugin",
] }
# What `store` keeps between runs. Pure Rust, one file, transactional writes, and an
# in-memory backend for tests. No redb type appears in `store`'s API, so that it can be
# swapped or upgraded.
redb = "4.3"
# Decodes the PNG textures that MTM2 Community Patch 3 packs in archives. Bevy already
# builds this version for its own image loading, so it adds nothing to compile.
png = "0.18"
# cpal is already here through Bevy's audio. The feature asks the OS for real-time
# priority on the audio thread (through RTKit on Linux), so that the game's own threads
# cannot hold it off its 43 ms buffer: see the notes in `src/sound/mod.rs`. RTKit is
# reached over D-Bus; the D-Bus library is built from the crate's own copy, so that no
# development package is needed.
cpal = { version = "0.17", features = ["audio_thread_priority"] }
libdbus-sys = { version = "0.2", features = ["vendored"] }

# Our own code is unoptimised so the debugger can show every local and step line by line,
# while full optimisation for dependencies keeps Bevy and Avian usable in debug builds.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
# Turn off debug info completely for all external dependencies
debug = false

# Aggressive optimizations for your final production build
[profile.release]
opt-level = 3
lto = "thin"          # Link-Time Optimization merges optimization across crates
codegen-units = 1     # Allows the compiler to optimize math streams globally
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
